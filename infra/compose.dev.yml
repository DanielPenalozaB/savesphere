# Local infrastructure only. Apps run on the host with `pnpm dev` for fast reloads.
name: savesphere-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: savesphere
      POSTGRES_PASSWORD: savesphere
      POSTGRES_DB: savesphere
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18 images store data under /var/lib/postgresql/<major>/docker
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U savesphere']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
