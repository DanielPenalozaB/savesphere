services:
  db:
    image: postgres:15-alpine
    container_name: savesphere-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-savesphere}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-savesphere}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-savesphere}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - savesphere

  api:
    image: ghcr.io/danielpenalozab/savesphere-api:latest
    container_name: savesphere-api
    restart: always
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-savesphere}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-savesphere}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRY: ${JWT_ACCESS_TOKEN_EXPIRY:-24h}
      APP_ENV: production
      APP_BASE_URL: https://${DOMAIN:-savesphere.app}
      CORS_ALLOWED_ORIGINS: https://${DOMAIN:-savesphere.app},https://www.${DOMAIN:-savesphere.app}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      OAUTH_REDIRECT_URL: https://${DOMAIN:-savesphere.app}/auth/callback
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health > /dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - savesphere
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.savesphere-api.rule=(Host(`${DOMAIN:-savesphere.app}`) || Host(`www.${DOMAIN:-savesphere.app}`)) && PathPrefix(`/api`)"
      - "traefik.http.routers.savesphere-api.priority=20"
      - "traefik.http.routers.savesphere-api.tls=true"
      - "traefik.http.routers.savesphere-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.savesphere-api.loadbalancer.server.port=3000"

  web:
    image: ghcr.io/danielpenalozab/savesphere-web:latest
    container_name: savesphere-web
    restart: always
    environment:
      VITE_API_BASE: /api
      ORIGIN: https://${DOMAIN:-savesphere.app}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ > /dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - savesphere
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.savesphere-web.rule=Host(`${DOMAIN:-savesphere.app}`) || Host(`www.${DOMAIN:-savesphere.app}`)"
      - "traefik.http.routers.savesphere-web.priority=10"
      - "traefik.http.routers.savesphere-web.tls=true"
      - "traefik.http.routers.savesphere-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.savesphere-web.loadbalancer.server.port=3000"

volumes:
  postgres_data:

networks:
  savesphere:
    driver: bridge
  coolify:
    name: coolify
    external: true
